name: Release

# Open item #6, closed by decision D-013: a version tag cuts a release, and
# workflow_dispatch allows testing the build without creating a throwaway tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Safety net for transitive actions not yet native to Node 24; the pinned
  # versions below are the actual fix.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    # Windows-only by design: SPEC.md 1 scopes v1 to Windows, and the tool
    # reads the Steam path from the Windows registry via `winreg`, which does
    # not exist on other platforms.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6.0.3

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.x"

      - name: Install package and PyInstaller
        # PyInstaller deliberately unpinned so prebuilt bootloaders are used.
        run: pip install . pyinstaller

      - name: Build the executable
        run: pyinstaller --onefile --name wrsrcli-windows-amd64 --add-binary "wrsrcli/vendor/steamworks/steam_api64.dll;wrsrcli/vendor/steamworks" entrypoint.py

      - name: Smoke test the executable
        # Phase 10's verify: the frozen binary must run and list every command.
        run: |
          ./dist/wrsrcli-windows-amd64.exe --version
          ./dist/wrsrcli-windows-amd64.exe --help

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrsrcli-windows-amd64
          path: dist/wrsrcli-windows-amd64.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: dist/wrsrcli-windows-amd64.exe

      # `wrsrcli --version` fetches versions/v{its own version}.txt and prints
      # the line it finds, so this is what tells an installed build that it has
      # fallen behind. Runs after the release is attached: the note tells users
      # to upgrade, and the thing to upgrade to must exist first.
      - name: Record this release in versions/
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $date = [datetime]::UtcNow.ToString('d MMMM yyyy', [cultureinfo]::InvariantCulture)

          # The tag is a detached HEAD; these files belong on main.
          git fetch origin main
          git checkout -B main origin/main

          New-Item -ItemType Directory -Force versions | Out-Null

          # The new file first, so there is never a moment where every file
          # says "outdated" and none says which version to get.
          $new = "versions/$tag.txt"
          "$tag - released on $date. This is the latest version." |
            Set-Content -Path $new -Encoding utf8NoBOM

          # Then every other one, keeping its own version and release date.
          Get-ChildItem versions/*.txt |
            Where-Object { $_.Name -ne "$tag.txt" } |
            ForEach-Object {
              $line = Get-Content $_.FullName -TotalCount 1
              if ($line -match '^(?<v>v\S+) - released on (?<d>.+?)\.') {
                "$($Matches.v) - released on $($Matches.d). This file is outdated. Please run wrsrcli upgrade to download the latest version." |
                  Set-Content -Path $_.FullName -Encoding utf8NoBOM
              } else {
                Write-Warning "versions/$($_.Name) is not in the expected format; left alone."
              }
            }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "versions/ already up to date."
          } else {
            git commit -m "Record $tag in versions/"
            git push origin main
          }
