[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wrsrcli"
version = "0.1.0"
description = "Manage Steam Workshop assets for Workers & Resources: Soviet Republic"
readme = "README.md"
requires-python = ">=3.12"
# The Python code is Apache-2.0. One bundled file is not: Valve's
# steam_api64.dll, under the Steamworks SDK Access Agreement. See NOTICE
# and THIRD-PARTY-NOTICES.md — this field describes wrsrcli's own code.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-NOTICES.md"]
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
wrsrcli = "wrsrcli.cli:main"

[tool.setuptools]
packages = ["wrsrcli", "wrsrcli.vendor.steamworks"]

[tool.setuptools.package-data]
"wrsrcli.vendor.steamworks" = ["steam_api64.dll"]
